name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting
        run: npm run format:check
        continue-on-error: false

  test:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start services with Docker Compose
        run: |
          echo "Starting MinIO service..."
          docker compose -f docker/compose.dev.yml --profile ci up -d minio minio-init 2>&1 || true
          echo "Services started, waiting for MinIO to be ready..."

      - name: Wait for MinIO to be ready
        run: |
          echo "Waiting for MinIO to accept connections..."
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "✅ MinIO is healthy!"
              sleep 2
              break
            fi
            attempt=$((attempt + 1))
            echo "Waiting... attempt $attempt/$max_attempts"
            sleep 1
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ MinIO failed to become ready"
            docker compose -f docker/compose.dev.yml logs minio
            exit 1
          fi

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PORT: 3000
          S3_REGION: us-east-1
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET_NAME: downloads
          S3_FORCE_PATH_STYLE: "true"
          SENTRY_DSN: ""
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          REQUEST_TIMEOUT_MS: "30000"
          RATE_LIMIT_WINDOW_MS: "60000"
          RATE_LIMIT_MAX_REQUESTS: "100"
          CORS_ORIGINS: "*"
          DOWNLOAD_DELAY_ENABLED: "true"
          DOWNLOAD_DELAY_MIN_MS: "1000"
          DOWNLOAD_DELAY_MAX_MS: "2000"

      - name: Stop services
        if: always()
        continue-on-error: true
        run: docker compose -f docker/compose.dev.yml down --remove-orphans 2>&1 || true

      - name: Test Results Summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All E2E tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ E2E tests failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          tags: |
            delineate-hackathon-challenge:latest
            delineate-hackathon-challenge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build Summary
        if: always()
        run: |
          echo "## Docker Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Docker image built successfully!" >> $GITHUB_STEP_SUMMARY
            echo "- Image: `delineate-hackathon-challenge:${{ github.sha }}`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker build failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  ci-status:
    name: CI Pipeline Status
    runs-on: ubuntu-24.04
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
