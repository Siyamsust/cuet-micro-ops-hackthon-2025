name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_VERSION: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run E2E tests
        env:
          DOWNLOAD_DELAY_ENABLED: "false"
          NODE_ENV: test
        run: npm run test:e2e

      - name: Build Docker image (validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          tags: local/delineate:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
